<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolphin</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 20px 40px;
        }

        .brand {
            font-size: 1.125rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #1a1a1a;
        }

        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 48px;
            color: #1a1a1a;
            line-height: 1.3;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .card-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            text-decoration: none;
            color: #1a1a1a;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }

        .card-button:hover {
            border-color: #9ca3af;
            background-color: #f3f4f6;
        }

        .card-button img {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            object-fit: contain;
        }

        .card-button span {
            font-size: 1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">Dolphin</div>
    </header>

    <main>
        <h1>Indian Antarctica Expedition Logistics and Asset Planning</h1>

        <div class="grid-container">
            <a href="planning.html" class="card-button">
                <img src="https://img.icons8.com/?size=100&id=MrzGWtQ1Pmdk&format=png&color=000000" alt="Expedition Planning">
                <span>Expedition Planning</span>
            </a>

            <a href="cargo.html" class="card-button">
                <img src="https://img.icons8.com/?size=100&id=aemAJ33A8uDo&format=png&color=000000" alt="Cargo Tracking">
                <span>Cargo Tracking</span>
            </a>

            <a href="inventory.html" class="card-button">
                <img src="https://img.icons8.com/?size=100&id=LB0YB01k9Q9m&format=png&color=000000" alt="Inventory Management">
                <span>Inventory Management</span>
            </a>

            <a href="personnel.html" class="card-button">
                <img src="https://img.icons8.com/?size=100&id=J2HcqQ3sPh4v&format=png&color=000000" alt="Personnel Movement">
                <span>Personnel Movement</span>
            </a>
        </div>
    </main>

</body>
</html>
