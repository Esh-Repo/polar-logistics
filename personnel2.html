<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOLPHIN — Personnel Operations</title>
<style>
:root{
  --bg:#f4f7f9; --panel:#fff; --line:#d9e1e7; --text:#17232d; --muted:#71808c;
  --blue:#1769aa; --blue2:#eaf3fa; --green:#237a57; --green2:#eaf6f0;
  --amber:#a96800; --amber2:#fff5df; --red:#a33a3a; --red2:#fbecec; --slate:#526372;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px}
button,input,select{font:inherit}
button{cursor:pointer}
.topbar{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;justify-content:space-between}
.brand{font-weight:800;letter-spacing:.22em;font-size:17px}
.topright{display:flex;align-items:center;gap:18px;color:var(--muted);font-size:12px}
.live{display:flex;align-items:center;gap:7px;color:var(--green);font-weight:700}.dot{width:7px;height:7px;border-radius:50%;background:#2c8a63}
.page{padding:22px 28px 30px;max-width:1600px;margin:auto}
.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}
.eyebrow{font-size:10px;letter-spacing:.18em;color:#788895;font-weight:800;text-transform:uppercase}
h1{font-size:30px;line-height:1;margin:5px 0 6px;letter-spacing:-.03em}
.sub{color:var(--muted)}
.primary{border:1px solid #0f5d99;background:#1769aa;color:#fff;border-radius:5px;padding:10px 15px;font-weight:700}
.primary:hover{background:#155e96}
.primary-danger{border:1px solid #8d2d2d;background:#a33a3a;color:#fff;border-radius:5px;padding:10px 15px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.primary-danger:hover{background:#892d2d}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.stat .n{font-size:25px;font-weight:750;line-height:1.1}.stat .l{font-size:11px;color:var(--muted);margin-top:5px}
.layout{display:grid;grid-template-columns:300px minmax(500px,1fr) 330px;gap:10px}
.panel{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.panelhead{height:49px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:750}
.panelhead small{font-weight:600;color:var(--muted)}
.directory-tools{padding:10px;border-bottom:1px solid var(--line);display:grid;gap:7px}
input,select{height:34px;border:1px solid #cfd9e0;border-radius:4px;background:#fff;color:var(--text);padding:0 9px;outline:none}
input:focus,select:focus{border-color:#7ba9c8}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.people{max-height:625px;overflow:auto}
.person{padding:11px 13px;border-bottom:1px solid #e5ebef;display:grid;grid-template-columns:34px 1fr;gap:10px;position:relative;cursor:pointer}
.person:hover{background:#f7fafc}.person.active{background:#edf5fa}.person.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.person.sos-alert{background:#fdf2f2}.person.sos-alert:before{background:var(--red)}
.avatar{width:34px;height:34px;border:1px solid #d3dfe6;background:#f3f7f9;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#60717e}
.pname{font-weight:750}.pid{font-size:10px;color:var(--muted);margin-top:2px}
.prow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:var(--muted);font-size:10px}
.badge{display:inline-flex;align-items:center;border-radius:3px;padding:3px 6px;font-size:10px;font-weight:750;border:1px solid transparent}
.safe{background:var(--green2);color:var(--green);border-color:#cfe9dc}.transit{background:var(--blue2);color:var(--blue);border-color:#cfe1ee}.field{background:var(--amber2);color:var(--amber);border-color:#eed7a9}.attention{background:var(--red2);color:var(--red);border-color:#edcaca}.offline{background:#eef1f3;color:#5e6d78;border-color:#d8dfe3}
.mapwrap{height:674px;background:#e7eef2;position:relative}
.maphead{position:absolute;z-index:4;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;pointer-events:none}
.maplabel,.maptime{background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 10px;box-shadow:0 1px 3px rgba(20,40,55,.08)}
.maplabel strong{font-size:11px;display:block}.maplabel span{font-size:10px;color:var(--muted)}
.maptime{font-size:11px;color:var(--green);font-weight:900;background:#fff;border:1px solid #cbd7dd;border-radius:6px;padding:7px 9px;box-shadow:0 2px 7px rgba(20,40,55,.10);white-space:nowrap}
.maplegend{position:absolute;z-index:4;left:12px;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:9px 11px;display:grid;gap:6px;font-size:10px}
.leg{display:flex;gap:8px;align-items:center}.swatch{width:18px;height:3px;background:#1769aa}.dash{height:0;border-top:2px dashed #b87514}.stationdot{width:9px;height:9px;border:2px solid #237a57;background:#fff;transform:rotate(45deg)}
.map svg{width:100%;height:100%;display:block}
.station-card{fill:#fff;stroke:#c8d5dc;stroke-width:1.2}.station-roof{fill:#f5f8fa;stroke:#9eafb9;stroke-width:1}
.station-label{font-size:12px;font-weight:800;fill:#20303b;letter-spacing:.04em}.station-sub{font-size:9px;fill:#70808b}
.right{padding:0}.detail{padding:15px}.personhero{display:flex;gap:11px;align-items:center;padding-bottom:13px;border-bottom:1px solid var(--line)}
.heroavatar{width:42px;height:42px;border-radius:50%;background:#f0f5f7;border:1px solid #d3dfe5;display:grid;place-items:center;font-weight:800;color:#60727f}
.hero-name{font-size:16px;font-weight:800}.hero-meta{font-size:10px;color:var(--muted);margin-top:3px}
.section{padding:13px 0;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}
.sectiontitle{font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:#74838e;margin-bottom:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kv span{display:block;color:var(--muted);font-size:9px;margin-bottom:3px}.kv strong{font-size:11px}
.progress{height:6px;background:#e7edf0;border-radius:3px;margin-top:7px;overflow:hidden}.progress i{display:block;height:100%;background:#1769aa}
.timeline{position:relative;padding-left:16px;display:grid;gap:11px}.timeline:before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:1px;background:#ccd8df}
.event{position:relative}.event:before{content:"";position:absolute;left:-15px;top:3px;width:7px;height:7px;border-radius:50%;background:#fff;border:2px solid #8aa1af}
.event.current:before{border-color:#1769aa;background:#1769aa}.event.plan:before{border-color:#b87514}.event.danger:before{border-color:#a33a3a;background:#a33a3a}
.action{width:100%;height:34px;border:1px solid #cbd8df;background:#fff;border-radius:4px;color:#35505f;font-weight:700}.action:hover{background:#f5f8fa}
.action.danger-action{background:#fbecec;border-color:#e8c9c9;color:#a33a3a}.action.danger-action:hover{background:#f8dede}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#fff}.tab{border:0;background:transparent;padding:11px 13px;font-size:11px;font-weight:750;color:#71808b;border-bottom:2px solid transparent}.tab.active{color:#1769aa;border-bottom-color:#1769aa}
.content{padding:12px}
.hidden{display:none!important}
.teamgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.teamcard{border:1px solid var(--line);background:#fff;border-radius:5px;padding:13px}.teamtop{display:flex;justify-content:space-between}.teamname{font-weight:800}.teammeta{font-size:10px;color:var(--muted);margin:4px 0 10px}.memberrow{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid #edf1f3;font-size:10px}.memberrow span:last-child{color:var(--muted)}
.accountgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.account{background:#fff;border:1px solid var(--line);border-radius:5px;padding:13px}.account h3{font-size:12px;margin:0 0 5px}.bigcheck{font-size:28px;font-weight:800}.account p{margin:4px 0;color:var(--muted);font-size:10px}
.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:5px;overflow:hidden}.table th,.table td{text-align:left;padding:10px 11px;border-bottom:1px solid #e7ecef;font-size:10px}.table th{color:#74838e;font-size:9px;text-transform:uppercase;letter-spacing:.08em;background:#f8fafb}.table tr:last-child td{border-bottom:0}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fieldbox label{display:block;font-size:9px;color:var(--muted);font-weight:750;margin-bottom:5px}.full{grid-column:1/-1}
.modalback{position:fixed;inset:0;background:rgba(19,32,42,.35);display:grid;place-items:center;z-index:2000}.modal{width:min(760px,calc(100vw - 30px));background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 12px 35px rgba(20,35,45,.18)}.modalhead{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-weight:800}.close{border:0;background:transparent;font-size:18px;color:#697984}.modalbody{padding:17px;max-height:80vh;overflow-y:auto}.modalfoot{padding:12px 17px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.secondary{border:1px solid #cbd8df;background:#fff;border-radius:4px;padding:9px 13px;font-weight:700;color:#445b69}
.notice{padding:10px 11px;border:1px solid #e3d4b0;background:#fff8e9;color:#7d5a15;border-radius:4px;font-size:10px;line-height:1.5}

#mapCanvas{position:absolute;inset:0}.mapwrap{overflow:hidden;border:1px solid var(--line)}

.maptools{position:absolute;z-index:5;right:54px;top:12px;display:flex;gap:6px}.maptools button{height:32px;padding:0 10px;border:1px solid #cfd9e0;background:#fff;border-radius:4px;color:#38515f;font-size:10px;font-weight:800;box-shadow:0 2px 6px rgba(20,40,55,.08)}.maptools button:hover{background:#f5f8fa}
.mapstatus{position:absolute;z-index:5;right:12px;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:9px 11px;box-shadow:0 2px 7px rgba(20,40,55,.10);display:grid;gap:2px;min-width:180px}.mapstatus strong{font-size:11px}.mapstatus span{font-size:10px;color:var(--muted)}
.legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #526372}.legend-dot.station{background:#237a57;box-shadow:0 0 0 1px #237a57}.legend-dot.selected{background:#1769aa;box-shadow:0 0 0 1px #1769aa}.legend-dot.fieldzone{background:#fff;box-shadow:0 0 0 1px #8b9da8}.legend-line{width:19px;height:3px;display:inline-block}.legend-line.active{background:#1769aa}.legend-line.planned{border-top:2px dashed #a96800;height:0}
@media(max-width:1150px){.layout{grid-template-columns:260px 1fr}.right{grid-column:1/-1}.mapwrap{height:560px}.teamgrid,.accountgrid{grid-template-columns:1fr}}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.mapwrap{height:500px}.head{align-items:start;gap:12px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}

.polar-map{position:absolute;inset:0;background:#dce7ec;overflow:hidden}.polar-map svg{width:100%;height:100%;display:block;transition:transform .45s ease}.gridline{fill:none;stroke:#b9cbd3;stroke-width:1;stroke-dasharray:2 5;opacity:.65}.route-active-svg{fill:none;stroke:#1769aa;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:url(#shadow)}.route-planned-svg{fill:none;stroke:#a96800;stroke-width:2.5;stroke-dasharray:7 6;stroke-linecap:round;opacity:.9}.station-halo{fill:#fff;stroke:#237a57;stroke-width:2}.station-core{fill:#237a57;stroke:#fff;stroke-width:2}.station-label{font-size:13px;font-weight:800;fill:#20303b;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.person-ring{fill:#fff;stroke:#526372;stroke-width:2}.person-ring.sel{fill:#1769aa;stroke:#fff;stroke-width:3}.person-core{fill:#526372}.person-core.sel{fill:#fff}.person-label{font-size:10px;font-weight:700;fill:#334956;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}.zone-ring{fill:#fff;stroke:#8b9da8;stroke-width:2;stroke-dasharray:4 4}.zone-dot{fill:#a96800}.zone-label{font-size:10px;font-weight:800;fill:#526372;paint-order:stroke;stroke:#fff;stroke-width:3px}.pole-label,.lat-label{font-size:9px;font-weight:800;fill:#728691;letter-spacing:.08em}.map-scale line{stroke:#526a76;stroke-width:2}.map-scale text{font-size:9px;fill:#526a76;font-weight:700}.person-pin,.station-pin{cursor:pointer}.person-pin:focus,.station-pin:focus{outline:none}.mapwrap{background:#dce7ec}
.mapwrap{background:#dfe8ed}
.map svg{background:#dfe8ed}
.mapfocus{fill:none;stroke:#1769aa;stroke-width:1.5;stroke-dasharray:3 5}
.healthgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.healthcard{border:1px solid #d8e1e6;border-radius:4px;padding:9px;background:#fbfcfd}
.healthcard span{display:block;color:#71808c;font-size:9px;margin-bottom:3px}
.healthcard strong{font-size:13px}
.healthnormal{color:#237a57}.healthmonitor{color:#a96800}.healthcritical{color:#a33a3a}
.livepos{font-weight:750;color:#1769aa}
.map-note{position:absolute;right:12px;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:7px 9px;font-size:9px;color:#71808c;z-index:4}

.polar-map{position:absolute;inset:0;background:#eaf2f6;overflow:hidden}.polar-map svg{width:100%;height:100%;display:block;transition:transform .45s ease;transform-origin:50% 50%}.ocean{fill:#eaf2f6}.ocean-disc{fill:#dfeaf0;stroke:#b5c8d2;stroke-width:1.5}.polar-frame{fill:none;stroke:#b7cad4;stroke-width:1}.gridline{fill:none;stroke:#a9c0cb;stroke-width:1;stroke-dasharray:3 6;opacity:.48}.gridlabel{font-size:9px;fill:#78909c;font-weight:700}.ice-land{fill:#f9fbfc;stroke:#91a9b5;stroke-width:2}.ice-shelf{fill:none;stroke:#c7d8df;stroke-width:5;opacity:.8}.pole-dot{fill:#536e7b}.pole-label{font-size:10px;font-weight:800;fill:#607986;letter-spacing:.08em}.map-title{font-size:13px;font-weight:800;fill:#233640;letter-spacing:.08em}.map-subtitle{font-size:10px;font-weight:650;fill:#7a8e99;letter-spacing:.04em}.station-halo{fill:#fff;stroke:#1d8b67;stroke-width:2}.station-core{fill:#1d8b67;stroke:#fff;stroke-width:2}.station-label{font-size:12px;font-weight:800;fill:#233640;paint-order:stroke;stroke:#f9fbfc;stroke-width:4px}.station-sub{font-size:8px;fill:#718792;paint-order:stroke;stroke:#f9fbfc;stroke-width:3px}.person-pin{cursor:pointer}.person-label,.selected-label{font-size:10px;font-weight:800;fill:#233640;paint-order:stroke;stroke:#fff;stroke-width:4px}.selected-status{font-size:9px;font-weight:700;fill:#617783;paint-order:stroke;stroke:#fff;stroke-width:3px}.route-under{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.85}.route-active-svg{fill:none;stroke:#1769aa;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.route-planned-svg{fill:none;stroke:#b87818;stroke-width:2.5;stroke-dasharray:8 7;stroke-linecap:round;opacity:.95}.current-halo{fill:#1769aa;opacity:.08;stroke:#1769aa;stroke-width:1.5}.zone-ring{fill:#fff;stroke:#b87818;stroke-width:2;stroke-dasharray:4 4}.zone-dot{fill:#b87818}.zone-label{font-size:10px;font-weight:800;fill:#5f707a;paint-order:stroke;stroke:#fff;stroke-width:4px}.projection-label{font-size:9px;fill:#718691;font-weight:700;letter-spacing:.06em}.map-scale line{stroke:#526a76;stroke-width:2}.map-scale text{font-size:9px;fill:#526a76;font-weight:700}.mapwrap{background:#eaf2f6}.mapstatus{min-width:225px}

function showToast(title, desc, type = 'info') {
  const container = document.getElementById('toastContainer');
  if(!container) return;
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  const icon = type === 'danger' ? '🚨' : type === 'success' ? '✓' : type === 'warn' ? '⚠' : '🛰';
  toast.innerHTML = `
    <div>
      <div class="toast-title"><span>${icon}</span> <span>${title}</span></div>
      <div class="toast-desc">${desc}</div>
    </div>
    <button class="toast-close" onclick="this.parentElement.remove()">×</button>
  `;
  container.appendChild(toast);
  setTimeout(() => {
    if(toast && toast.parentElement) toast.remove();
  }, 4500);
}

const weatherFeed={
  Maitri:{temp:-18,wind:31,visibility:7.2,condition:'Cold · moderate wind',severity:'Caution'},
  Bharati:{temp:-22,wind:46,visibility:3.8,condition:'Strong wind · reduced visibility',severity:'High'}

function weatherFor(p){return weatherFeed[p.station]||weatherFeed.Maitri}

function getDistanceKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return Math.round(R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))) * 10) / 10;
}

function getBearingDeg(lat1, lon1, lat2, lon2) {
  const y = Math.sin((lon2 - lon1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
  const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) - Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lon2 - lon1) * Math.PI / 180);
  return Math.round((Math.atan2(y, x) * 180 / Math.PI + 360) % 360);
}

function calculateWindChill(tempC, windKmH) {
  if (windKmH < 5) return tempC;
  return Math.round(13.12 + (0.6215 * tempC) - (11.37 * Math.pow(windKmH, 0.16)) + (0.3965 * tempC * Math.pow(windKmH, 0.16)));
}

function getFrostbiteRisk(windChillC) {
  if (windChillC > -27) return "Low (> 60 min safety window)";
  if (windChillC > -38) return "Moderate (10-30 min window)";
  if (windChillC > -48) return "High (5-10 min window)";
  return "CRITICAL (< 5 min window)";
}

function getHypothermiaStage(temp) {
  if (temp >= 36.5) return { stage: "Normal core temperature", cls: "success" };
  if (temp >= 35.0) return { stage: "Mild Hypothermia (Shivering)", cls: "warn" };
  if (temp >= 32.0) return { stage: "Moderate Hypothermia (Apathy)", cls: "danger" };
  return { stage: "Severe Hypothermia (Critical)", cls: "danger" };
}

function getNearestRefuge(person) {
  const coord = personCoord(person);
  let nearest = null;
  let minDist = Infinity;
  refugeDepots.forEach(depot => {
    const d = getDistanceKm(coord[0], coord[1], depot.lat, depot.lon);
    if (d < minDist) {
      minDist = d;
      nearest = { ...depot, distance: d, bearing: getBearingDeg(coord[0], coord[1], depot.lat, depot.lon) };
    }
  });
  return nearest;
}

function routeRisk(p){
  if(p.status==='At Station') return {score:8,label:'Low',cls:'risk-low'};
  const w=weatherFor(p); let score=16;
  score += w.wind>=45?24:w.wind>=30?12:5;
  score += w.visibility<4?20:w.visibility<7?10:4;
  score += p.comm!=='Connected'?16:0;
  score += p.battery<50?14:p.battery<70?6:0;
  score += p.status==='Attention'||p.status==='SOS ACTIVE'?25:0;
  score += getProgress(p)>.75?7:0;
  score=Math.min(98,score);
  return {score,label:score>=70?'High':score>=40?'Moderate':'Low',cls:score>=70?'risk-high':score>=40?'risk-med':'risk-low'};
}
function geofenceInfo(p){
  if(p.status==='At Station') return {ok:true,text:'Inside station geofence'};
  if(p.id==='PER-005') return {ok:false,text:'0.8 km outside assigned operational corridor'};
  if(p.id==='PER-009' && getProgress(p)>.55) return {ok:false,text:'0.4 km outside survey corridor'};
  return {ok:true,text:'Inside assigned operational corridor'};
}
function communicationPrediction(p){
  if(p.status==='At Station') return 'Coverage stable';
  if(p.comm!=='Connected') return 'Signal currently weak — response risk elevated';
  if(p.station==='Bharati' && getProgress(p)>.35) return 'Weak-signal zone predicted in ~12 min';
  if(p.station==='Maitri' && getProgress(p)>.55) return 'Weak-signal zone predicted in ~18 min';
  return 'Coverage expected to remain stable';
}
function recalcEta(p){
  if(p.eta==='—') return '—';
  const parts=p.eta.split(':').map(Number); if(parts.length<2 || parts.some(Number.isNaN)) return p.eta;
  const r=routeRisk(p); let add=r.score>=70?25:r.score>=40?12:0; if(p.comm!=='Connected') add+=8;
  let mins=parts[0]*60+parts[1]+add; mins=((mins%1440)+1440)%1440; return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');
}
function overdueInfo(p){
  if(p.status==='At Station') return {overdue:false,minutes:0};
  const r=routeRisk(p); const delay=(r.score>=70?18:r.score>=40?8:0)+(p.comm!=='Connected'?7:0)+(p.status==='Attention'||p.status==='SOS ACTIVE'?12:0);
  return {overdue:delay>=15,minutes:delay};
}
function timelineFor(p){
  const pct=Math.round(getProgress(p)*100);
  const events = [
    ['Departure',`${p.origin} · ${movementStarted[p.id]||'20:30 IST'}`,''],
    ['Checkpoint 1',`Route checkpoint · ${Math.max(18,Math.round(pct*.55))}% complete`,''],
    ['Current position',`${movementState(p)} · ${p.last}`,p.status==='SOS ACTIVE'?'danger':'current']
  ];
  if(p.status==='SOS ACTIVE') {
    events.push(['SAR Dispatch', 'Search & Rescue protocol active · Tracking emergency beacon', 'danger']);
  } else {
    events.push(['Next milestone',`${p.dest} · ETA ${recalcEta(p)}`,'plan']);
  }
  return events;
}

function executeSarAction(personId, stepKey) {
  const p = people.find(x => x.id === personId);
  if(!p) return;
  if(!p.sarSteps) p.sarSteps = {beacon:true,refugeSent:false,sarDispatched:false};
  const refuge = getNearestRefuge(p);
  const w = weatherFor(p);

  if(stepKey === 'refuge') {
    p.sarSteps.refugeSent = true;
    const msg = `Emergency Refuge Waypoint (${refuge.name} @ ${refuge.distance}km, Brg ${refuge.bearing}°) transmitted via Iridium SBD link to handheld GPS.`;
    addSarLog(personId, `🏠 ${msg}`, 'warn');
    showToast(`Refuge Vector Transmitted`, msg, 'warn');
  } else if(stepKey === 'dispatch') {
    p.sarSteps.sarDispatched = true;
    const snowcatEtaMins = Math.round((refuge.distance / 14) * 60) + 10; // speed ~14 km/h
    const msg = `Mobile PistenBully SAR Tracked Vehicle dispatched from ${p.station} Station. Calculated Overland ETA: ~${snowcatEtaMins} mins.`;
    addSarLog(personId, `🚜 ${msg}`, 'success');
    showToast(`SAR Team Mobilized`, msg, 'success');
  } else if(stepKey === 'air') {
    if(w.visibility < 4.0 || w.wind > 40) {
      const warning = `Air evacuation limited: Ground Visibility ${w.visibility}km / Wind ${w.wind}km/h violates Basler BT-67 VFR minimums. Helicopter on Ground Standby.`;
      addSarLog(personId, `⚠️ ${warning}`, 'warn');
      showToast(`Air Launch Warning`, warning, 'warn');
    } else {
      const msg = `Polar Basler BT-67 / Helicopter launched from ${p.station} Airstrip. Medevac medical crew airborne.`;
      addSarLog(personId, `🚁 ${msg}`, 'success');
      showToast(`Air Evac Airborne`, msg, 'success');
    }
  } else if(stepKey === 'cancel') {
    p.status = 'In Transit';
    p.comm = 'Connected';
    p.health = 'Normal';
    p.sarSteps = {beacon:false,refugeSent:false,sarDispatched:false};
    addSarLog(personId, `✓ Emergency protocol stood down. Status returned to normal operations.`, 'success');
    showToast(`SAR Stood Down`, `Distress status cleared for ${p.name}. Systems updated.`, 'success');
  }
  renderAll();
  openResponse(p);
}

let leafletMap=null;
let followLive=false;
let leafletLayers={};
const stationCoords={
  Maitri:[-70.76683,11.73078],
  Bharati:[-69.40680,76.19525]
};
const fieldCoords={
  "Field Zone A":[-70.64,12.08],
  "Survey Point":[-70.61,12.28],
  "Field Zone B":[-69.30,76.55]
};

const movementProgress={"PER-001":.58,"PER-002":.43,"PER-005":.68,"PER-007":.52,"PER-009":.46};
const movementStarted={"PER-001":"20:30 IST","PER-002":"20:20 IST","PER-005":"19:55 IST","PER-007":"20:05 IST","PER-009":"20:10 IST"};
function getProgress(p){
  if(p.status==='At Station') return 1;
  return Math.max(0.02,Math.min(0.98,movementProgress[p.id] ?? .5));
}
function personCoord(p){
  const s=stationCoords[p.station];
  if(p.status==='At Station') return s;
  const d=fieldCoords[p.dest] || (p.station==='Maitri'?fieldCoords['Field Zone A']:fieldCoords['Field Zone B']);
  const progress=getProgress(p);
  const idx=parseInt(p.id.slice(-1),10)||1;
  const lateral=((idx%3)-1)*0.055;
  return [s[0]+(d[0]-s[0])*progress+lateral, s[1]+(d[1]-s[1])*progress+lateral];
}
function progressLabel(p){return p.status==='At Station'?'100%':Math.round(getProgress(p)*100)+'%'}
function movementState(p){
  if(p.status==='SOS ACTIVE') return '🚨 SOS EMERGENCY';
  if(p.status==='Attention') return 'Attention / delayed';
  if(p.status==='Offline') return 'Signal lost';
  if(p.status==='Field Mission') return 'On field mission';
  if(p.status==='In Transit') return 'In transit';
  return 'At station';
}
function esc(s){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function markerClass(p){return p.status==='At Station'?'green':p.status==='Field Mission'?'amber':p.status==='Attention'||p.status==='SOS ACTIVE'?'red':p.status==='Offline'?'gray':'blue'}
function popupForPerson(p){return `<div class="pop-title">${esc(p.name)} ${p.status==='SOS ACTIVE'?'🚨':''}</div><div class="pop-meta">${esc(p.id)} · ${esc(p.role)}</div><div class="pop-row"><span>Status</span><b style="${p.status==='SOS ACTIVE'?'color:#a33a3a':''}">${esc(p.status)}</b></div><div class="pop-row"><span>Station</span><b>${esc(p.station)}</b></div><div class="pop-row"><span>Mission</span><b>${esc(p.mission)}</b></div><div class="pop-row"><span>Battery</span><b>${p.battery}%</b></div><div class="pop-row"><span>Last update</span><b>${esc(p.last)}</b></div>${p.status==='SOS ACTIVE'?`<div style="margin-top:8px"><button onclick="openResponse(people.find(x=>x.id==='${p.id}'))" style="width:100%;background:#a33a3a;color:#fff;border:0;padding:5px;border-radius:3px;font-weight:800;font-size:10px">OPEN SAR COMMAND</button></div>`:''}`}
function stationPopup(name){const c=stationCoords[name];return `<div class="pop-title">${name} Research Station</div><div class="pop-meta">Indian Antarctic Programme</div><div class="pop-row"><span>Coordinates</span><b>${Math.abs(c[0]).toFixed(4)}°S ${c[1].toFixed(4)}°E</b></div><div class="pop-row"><span>Tracked personnel</span><b>${people.filter(p=>p.station===name).length}</b></div>`}
function routeForLeaflet(p){if(p.status==='At Station')return null;return [stationCoords[p.station],personCoord(p),fieldCoords[p.dest]||personCoord(p)]}
function plannedForLeaflet(p){if(p.status==='At Station')return null;return [stationCoords[p.station],fieldCoords[p.dest]||personCoord(p)]}

ate ${esc(p.last)}</span></div><div id="mapLoading" class="map-loading">Loading live map…</div>`;

 leafletLayers={markers:[],routes:[],stations:[],destinations:[],sarOverlays:[]};

   leafletLayers.destinations.push(rm);
 });

 if(mapPrefs.fieldZones){ Object.entries(fieldCoords).forEach(([name,c])=>{ const circle=L.circle(c,{radius:6500,color:'#b87818',weight:1,dashArray:'5 5',fillColor:'#b87818',fillOpacity:.04}).addTo(leafletMap); circle.bindTooltip(name,{permanent:false,direction:'top'}); leafletLayers.destinations.push(circle); }); }
 if(mapPrefs.riskZones){ const w=weatherFor(p); const riskCenter=fieldCoords[p.dest]||fieldCoords['Field Zone A']; L.circle(riskCenter,{radius:w.severity==='High'?18000:10000,color:'#c44747',weight:1,fillColor:'#c44747',fillOpacity:.08}).addTo(leafletMap); }

 if(p.status!=='At Station'){

     leafletLayers.routes.push(L.polyline(active,{color:'#ffffff',weight:11,opacity:.98,lineCap:'round',lineJoin:'round'}).addTo(leafletMap));
     leafletLayers.routes.push(L.polyline(active,{color:routeColor,weight:7,opacity:1,lineCap:'round',lineJoin:'round'}).addTo(leafletMap));

     const dm=L.marker(d,{icon:L.divIcon({className:'',html:`<div style="width:16px;height:16px;border:2px solid ${routeColor};background:#fff;transform:rotate(45deg);box-shadow:0 2px 5px rgba(0,0,0,.18)"></div>`,iconSize:[16,16],iconAnchor:[8,8]})}).addTo(leafletMap).bindTooltip(esc(p.dest),{permanent:true,direction:'top',offset:[0,-7],className:'route-label'});
     leafletLayers.destinations.push(dm);

 }

 if(p.status === 'SOS ACTIVE') {

 people.forEach(person=>{

     leafletLayers.destinations.push(dm);

  const p=people.find(x=>x.id===id); if(!p)return;
  const origin=document.getElementById(prefix+'Origin').value;
  const dest=document.getElementById(prefix+'Destination').value;
  const transport=document.getElementById(prefix+'Transport').value;
  const mission=document.getElementById(prefix+'Mission').value.trim() || 'Expedition movement';
  const dep=document.getElementById(prefix+'Departure').value;
  const ret=document.getElementById(prefix+'Return').value;
  p.origin=origin; p.dest=dest; p.transport=transport; p.mission=mission; p.eta=ret?new Date(ret).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false}):'—';
  if(origin.includes('Maitri')) p.station='Maitri'; else if(origin.includes('Bharati')) p.station='Bharati';
  p.status='In Transit'; p.comm='Connected'; p.last=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false})+' IST';
  movementProgress[p.id]=.04; movementStarted[p.id]=p.last;
  history.unshift([new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),p.name,origin,dest,transport,'In Transit']);
  selected=p.id; renderAll(); document.getElementById('modal').classList.add('hidden');
  document.querySelector('[data-tab="tracking"]').click();
  showToast(`Movement Created`, `${p.name} dispatched from ${origin} to ${dest}.`, 'info');
}
document.getElementById("saveMovement").onclick=()=>addMovementFrom('m');
document.getElementById("createPlan").onclick=()=>{
  addMovementFrom('plan');
  document.querySelector('[data-tab="tracking"]').click();
};
function setDefaultMovementTimes(){
  ['m','plan'].forEach(prefix=>{document.getElementById(prefix+'Departure').value=nowInputValue();const d=new Date(Date.now()+90*60000);const pad=n=>String(n).padStart(2,'0');document.getElementById(prefix+'Return').value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`});
}
document.getElementById("newMove").onclick=()=>{setDefaultMovementTimes();document.getElementById("modal").classList.remove("hidden")};
document.getElementById("triggerPolarSos").onclick=()=>{
  const p = people.find(x => x.id === selected) || people[0];
  openResponse(p);
};

function refreshLiveMap(){
  if(!leafletMap) return;
  const p=people.find(x=>x.id===selected)||people[0];
  leafletLayers.markers.forEach(m=>{
    const person=people.find(x=>x.id===m.__personId);
    if(person) m.setLatLng(personCoord(person));
  });
  if(followLive){
    const current=personCoord(p);
    leafletMap.panTo(current,{animate:true,duration:.45});
  }
  leafletLayers.routes.forEach(l=>{try{leafletMap.removeLayer(l)}catch(e){}});
  leafletLayers.routes=[];
  leafletLayers.destinations.forEach(l=>{try{leafletMap.removeLayer(l)}catch(e){}});
  leafletLayers.destinations=[];
  if(p.status!=='At Station' && mapPrefs.activeRoute){
    const active=routeForLeaflet(p);
    if(active){
      const routeColor = p.status === 'SOS ACTIVE' ? '#a33a3a' : '#1769aa';
      leafletLayers.routes.push(L.polyline(active,{color:'#ffffff',weight:11,opacity:.98,lineCap:'round',lineJoin:'round',interactive:false}).addTo(leafletMap));
      leafletLayers.routes.push(L.polyline(active,{color:routeColor,weight:7,opacity:1,lineCap:'round',lineJoin:'round',interactive:false}).addTo(leafletMap));
      const d=fieldCoords[p.dest]||active[2];
      const dm=L.marker(d,{icon:L.divIcon({className:'',html:`<div style="width:16px;height:16px;border:2px solid ${routeColor};background:#fff;transform:rotate(45deg);box-shadow:0 2px 5px rgba(0,0,0,.18)"></div>`,iconSize:[16,16],iconAnchor:[8,8]})}).addTo(leafletMap).bindTooltip(esc(p.dest),{permanent:true,direction:'top',offset:[0,-7],className:'route-label'});
      leafletLayers.destinations.push(dm);
    }
  }
  const status=document.querySelector('.mapstatus');
  if(status){
    status.querySelector('strong').textContent=`${p.name} · ${p.id}`;
    const spans=status.querySelectorAll(':scope > span');
    if(spans[0]) spans[0].textContent=`${movementState(p)} · ${p.dest}`;
    const metric=status.querySelector('.mapmetric');
    if(metric){
      const vals=metric.querySelectorAll('b');
      if(vals[0]) vals[0].textContent=progressLabel(p);
      if(vals[1]) vals[1].textContent=p.battery+'%';
      if(vals[2]) vals[2].textContent=p.eta;
    }
    if(spans[1]) spans[1].textContent=`${p.transport} · Last update ${p.last}`;
  }
}
setInterval(()=>{
  let changed=false;
  people.forEach(p=>{
    if(p.status==='In Transit'||p.status==='Field Mission'){
      const before=getProgress(p); movementProgress[p.id]=Math.min(.94,before+.003); p.last=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false})+' IST'; changed=true;
    }
  });
  if(changed){renderStats();renderPeople();renderDetail();refreshLiveMap();}
},1000);
updateClock();renderAll();setInterval(updateClock,1000);
</script>
